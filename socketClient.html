    });
    socket.on("disconnect", function(e) {

    });
    socket.on("reconnect_error", function(e) {
      console.log("reconnect_error", e);
    });
    socket.on("connect", function() {
      socket.emit("connection");
      // socket.emit("send-typing",{destination:"625fe325aa5f1648d298d36b", conversation:"eeeae"});
      console.log("Connected");
    });
    socket.on("reconnect_failed", function() {
      console.log("reconnect_failed");
    });
    socket.on("afterConnect", function(data) {
      console.log("afterConnect", data);
    });
    socket.on("newMatch", function(data) {
      console.log("newMatch", data);
    });
    socket.on("new-message", function(data) {
      console.log("msg", data);
    });
    socket.on("message-reaction", function(data) {
      console.log("react", data);
    });
    socket.on("message-seen", function(data) {
      console.log("seen", data);
    });
    socket.on("disconnect", function() {

    });
